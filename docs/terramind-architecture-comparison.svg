<svg xmlns="http://www.w3.org/2000/svg" width="2800" height="1240" viewBox="0 0 2800 1240" role="img" aria-labelledby="title desc">
  <title id="title">IBM TerraMind and Nilam multimodal v2 architecture comparison</title>
  <desc id="desc">Side-by-side technical architecture of the original TerraMind any-to-any Earth-observation foundation model and Nilam's Kerala land-suitability multimodal v2 adaptation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#262626"/>
    </marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #151515; }
    .title { font-size: 43px; font-weight: 700; letter-spacing: 0.2px; }
    .subtitle { font-size: 21px; fill: #4b4b4b; }
    .panel-title { font-size: 32px; font-weight: 700; }
    .panel-subtitle { font-size: 19px; fill: #555; }
    .box-title { font-size: 23px; font-weight: 700; }
    .box-note { font-size: 18px; fill: #454545; }
    .metric { font-size: 20px; font-weight: 700; }
    .footer-title { font-size: 22px; font-weight: 700; }
    .footer-text { font-size: 20px; }
    .fine { font-size: 16px; fill: #595959; }
    .panel { fill: #fff; stroke: #393939; stroke-width: 2.3; }
    .box { fill: #fff; stroke: #282828; stroke-width: 2; }
    .fusion { fill: #f1f1f1; stroke: #151515; stroke-width: 2.5; }
    .output { fill: #e8e8e8; stroke: #151515; stroke-width: 2.5; }
    .wire { fill: none; stroke: #262626; stroke-width: 2.8; marker-end: url(#arrow); }
    .rule { stroke: #c2c2c2; stroke-width: 1.5; }
  </style>
  <rect width="2800" height="1240" fill="#fff"/>
  <text class="title" x="50" y="72">TERRAMIND  /  FROM FOUNDATION MODEL TO NILAM</text>
  <text class="subtitle" x="50" y="110">Original IBM-led any-to-any Earth-observation model compared with Nilam's Kerala suitability adaptation</text>

  <!-- Original TerraMind architecture, based on Jakubik et al., sections 4.1-4.4 and Figures 1 and 5. -->
  <g transform="translate(50 150)">
    <rect class="panel" x="0" y="0" width="1320" height="890"/>
    <text class="panel-title" x="70" y="55">ORIGINAL  /  TERRAMIND v1-B</text>
    <text class="panel-subtitle" x="70" y="88">IBM-led Earth-observation foundation model · generative pretraining</text>
    <line class="rule" x1="70" y1="111" x2="1250" y2="111"/>

    <rect class="box" x="70" y="135" width="1180" height="80"/>
    <text class="box-title" x="660" y="167" text-anchor="middle">Aligned Earth-observation modalities</text>
    <text class="box-note" x="660" y="194" text-anchor="middle">Sentinel-2 · Sentinel-1 · DEM · NDVI · land cover · captions · coordinates</text>

    <path class="wire" d="M330 215 V255"/>
    <path class="wire" d="M990 215 V255"/>
    <rect class="box" x="70" y="265" width="520" height="100"/>
    <text class="box-title" x="330" y="301" text-anchor="middle">Pixel-level path</text>
    <text class="box-note" x="330" y="332" text-anchor="middle">16 × 16 patches → learned linear embeddings</text>
    <rect class="box" x="730" y="265" width="520" height="100"/>
    <text class="box-title" x="990" y="301" text-anchor="middle">Token-level path</text>
    <text class="box-note" x="990" y="332" text-anchor="middle">Modality tokenizers · image FSQ / text WordPiece</text>

    <path class="wire" d="M330 365 V425"/>
    <path class="wire" d="M990 365 V425"/>
    <rect class="fusion" x="210" y="435" width="900" height="87"/>
    <text class="box-title" x="660" y="470" text-anchor="middle">Dual-scale early-fused input sequence</text>
    <text class="box-note" x="660" y="499" text-anchor="middle">Sampled observed pixel patches + discrete modality tokens</text>

    <path class="wire" d="M470 522 V570"/>
    <rect class="box" x="70" y="580" width="520" height="108"/>
    <text class="box-title" x="330" y="620" text-anchor="middle">TerraMind Transformer encoder</text>
    <text class="box-note" x="330" y="650" text-anchor="middle">Cross-modal representation learning</text>
    <path class="wire" d="M590 634 H720"/>
    <rect class="box" x="730" y="580" width="520" height="108"/>
    <text class="box-title" x="990" y="620" text-anchor="middle">TerraMind Transformer decoder</text>
    <text class="box-note" x="990" y="650" text-anchor="middle">Mask tokens → target-token prediction</text>

    <path class="wire" d="M330 688 V725"/>
    <path class="wire" d="M990 688 V725"/>
    <rect class="output" x="70" y="735" width="520" height="79"/>
    <text class="box-title" x="330" y="768" text-anchor="middle">Reusable encoder embeddings</text>
    <text class="box-note" x="330" y="796" text-anchor="middle">Fine-tune for downstream EO tasks</text>
    <rect class="output" x="730" y="735" width="520" height="79"/>
    <text class="box-title" x="990" y="768" text-anchor="middle">Any-to-any modality generation</text>
    <text class="box-note" x="990" y="796" text-anchor="middle">Target tokens → modality decoder · optional TiM</text>
    <line class="rule" x1="70" y1="835" x2="1250" y2="835"/>
    <text class="metric" x="660" y="865" text-anchor="middle">Masked target-token cross-entropy · no native suitability score</text>
  </g>

  <!-- Current Nilam multimodal v2. The TerraMind backbone is not a different foundation model. -->
  <g transform="translate(1430 150)">
    <rect class="panel" x="0" y="0" width="1320" height="890"/>
    <text class="panel-title" x="70" y="55">NEW  /  MULTIMODAL v2</text>
    <text class="panel-subtitle" x="70" y="88">Logit-level expert fusion  ·  current TerraMind multimodal head</text>
    <line class="rule" x1="70" y1="111" x2="1250" y2="111"/>

    <rect class="box" x="70" y="135" width="360" height="80"/>
    <text class="box-title" x="250" y="167" text-anchor="middle">Sentinel-2 satellite chips</text>
    <text class="box-note" x="250" y="194" text-anchor="middle">Dry + monsoon · 2 × 12 × 224 × 224</text>
    <rect class="box" x="890" y="135" width="360" height="80"/>
    <text class="box-title" x="1070" y="167" text-anchor="middle">Mapped site features</text>
    <text class="box-note" x="1070" y="194" text-anchor="middle">Same 38 tabular inputs</text>

    <path class="wire" d="M250 215 V255"/>
    <path class="wire" d="M1070 215 V255"/>
    <rect class="box" x="70" y="265" width="360" height="100"/>
    <text class="box-title" x="250" y="299" text-anchor="middle">TerraMind Base</text>
    <text class="box-note" x="250" y="328" text-anchor="middle">Shared seasonal encoder</text>
    <text class="box-note" x="250" y="352" text-anchor="middle">Pool + temporal Transformer</text>
    <rect class="box" x="890" y="265" width="360" height="100"/>
    <text class="box-title" x="1070" y="299" text-anchor="middle">FeatureTransformer</text>
    <text class="box-note" x="1070" y="328" text-anchor="middle">Pretrained statewide expert</text>
    <text class="box-note" x="1070" y="352" text-anchor="middle">Frozen during fusion training</text>

    <path class="wire" d="M250 365 V405"/>
    <path class="wire" d="M1070 365 V405"/>
    <rect class="box" x="70" y="415" width="360" height="100"/>
    <text class="box-title" x="250" y="457" text-anchor="middle">Vision tokens + logits</text>
    <text class="box-note" x="250" y="486" text-anchor="middle">Seasonal image context</text>
    <rect class="box" x="470" y="415" width="380" height="100"/>
    <text class="box-title" x="660" y="457" text-anchor="middle">Cross-attention logits</text>
    <text class="box-note" x="660" y="486" text-anchor="middle">Vision ↔ projected feature tokens</text>
    <rect class="box" x="890" y="415" width="360" height="100"/>
    <text class="box-title" x="1070" y="457" text-anchor="middle">Feature tokens + logits</text>
    <text class="box-note" x="1070" y="486" text-anchor="middle">Frozen tabular expert</text>
    <path class="wire" d="M430 465 H460"/>
    <path class="wire" d="M890 465 H860"/>

    <path class="wire" d="M250 515 V595"/>
    <path class="wire" d="M660 515 V595"/>
    <path class="wire" d="M1070 515 V595"/>
    <rect class="fusion" x="70" y="605" width="1180" height="91"/>
    <text class="box-title" x="660" y="639" text-anchor="middle">Bounded three-way gate over class logits + residual</text>
    <text class="box-note" x="660" y="670" text-anchor="middle">At least 2% per branch · zero-initialized residual correction</text>
    <path class="wire" d="M660 696 V736"/>
    <rect class="output" x="345" y="746" width="630" height="65"/>
    <text class="box-title" x="660" y="787" text-anchor="middle">Four-class multimodal probabilities</text>
    <line class="rule" x1="70" y1="835" x2="1250" y2="835"/>
    <text class="metric" x="660" y="865" text-anchor="middle">Test macro-F1 0.829  ·  mean gate: 5.5% vision / 88.4% tabular / 6.1% cross</text>
  </g>

  <rect class="panel" x="50" y="1072" width="2700" height="117"/>
  <text class="footer-title" x="85" y="1111">CURRENT NILAM DEPLOYMENT</text>
  <text class="footer-text" x="85" y="1147">Separate TabPFN 3.5 probabilities  +  v2 multimodal probabilities  →  agreement-aware geometric pool  →  final site score</text>
  <text class="fine" x="85" y="1174">The v2 head is weighted 29% when experts agree, 13% when they disagree. Evaluations use 300 held-out points with rule-derived weak labels, not verified building outcomes.</text>
  <text class="fine" x="50" y="1223">Sources: Jakubik et al., TerraMind, §§4.1–4.4 and Figs. 1, 5 (left); Nilam multimodal.py, fusion.py, and v2 evaluation (right).</text>
</svg>
