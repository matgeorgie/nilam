  <rect class="layer" x="430" y="585" width="1920" height="270" rx="34"/>
  <text class="layer-title" x="1390" y="617" text-anchor="middle">Layer 3: Multimodal Land Suitability Intelligence</text>

  <rect class="module" x="485" y="666" width="305" height="122" rx="11"/>
