  <text class="module-text" x="1367" y="765" text-anchor="middle">Final Suitability Percentage</text>

  <rect class="module" x="1580" y="666" width="305" height="122" rx="11"/>
  <text class="module-title" x="1732" y="707" text-anchor="middle">SHAP Explanation</text>
  <text class="module-text" x="1732" y="738" text-anchor="middle">Feature Drivers</text>
  <text class="module-text" x="1732" y="765" text-anchor="middle">Evidence Summary</text>

  <rect class="module-soft" x="1945" y="666" width="325" height="122" rx="11"/>
  <text class="module-title" x="2107" y="707" text-anchor="middle">Land Results</text>
  <text class="module-text" x="2107" y="738" text-anchor="middle">Score · Ranked Flat Land</text>
  <text class="module-text" x="2107" y="765" text-anchor="middle">Amenities · Street View</text>

  <path class="edge" d="M790 727 H818 V640 H1367 V660"/>
  <path class="edge" d="M1155 727 H1209"/>
  <path class="edge" d="M1520 727 H1574"/>
  <path class="edge" d="M1885 727 H1939"/>
  <path class="line" d="M1140 505 V630 H637 V660"/>
  <path class="edge" d="M2290 190 H2320 V636 H1002 V660"/>
