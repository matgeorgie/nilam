<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1520" viewBox="0 0 2400 1520" role="img" aria-labelledby="title desc">
  <title id="title">Nilam layered system architecture</title>
  <desc id="desc">A monochrome layered architecture for Nilam showing ingestion, land context processing, multimodal suitability, ArchAI2 house generation, Kerala cost estimation, outputs, and persistent data and model storage.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L11,5.5 L0,11 z" fill="#59636f"/>
    </marker>
    <style>
      .background { fill: #ffffff; }
      .layer { fill: #ffffff; stroke: #6b7581; stroke-width: 2.8; }
      .module { fill: #ffffff; stroke: #69737e; stroke-width: 2.2; }
      .module-soft { fill: #f7f8f9; stroke: #69737e; stroke-width: 2.2; }
      .title { font: 700 28px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #29313a; }
      .layer-title { font: 700 19px Inter, ui-sans-serif, system-ui, sans-serif; fill: #2f3740; }
      .module-title { font: 700 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: #343c46; }
      .module-text { font: 500 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #49535e; }
      .label { font: 600 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #3f4852; }
      .edge { fill: none; stroke: #59636f; stroke-width: 2.4; marker-end: url(#arrow); }
      .edge-dashed { fill: none; stroke: #6c7680; stroke-width: 2.2; stroke-dasharray: 9 8; marker-end: url(#arrow); }
      .line { fill: none; stroke: #59636f; stroke-width: 2.4; }
    </style>
  </defs>

  <rect class="background" width="2400" height="1520"/>
  <text class="title" x="1200" y="38" text-anchor="middle">NILAM — Layered System Architecture</text>

  <!-- Client application -->
  <rect class="module-soft" x="40" y="110" width="300" height="104" rx="11"/>
  <text class="module-title" x="190" y="151" text-anchor="middle">Nilam Client Application</text>
  <text class="module-text" x="190" y="181" text-anchor="middle">React + Google Maps</text>

  <!-- Layer 1 -->
  <rect class="layer" x="430" y="70" width="1920" height="230" rx="34"/>
  <text class="layer-title" x="1390" y="102" text-anchor="middle">Layer 1: Input &amp; Evidence Ingestion</text>

  <rect class="module" x="485" y="138" width="350" height="104" rx="11"/>
  <text class="module-title" x="660" y="176" text-anchor="middle">User Input Gateway</text>
  <text class="module-text" x="660" y="205" text-anchor="middle">Site · Radius · Text · Voice · House Brief</text>

  <rect class="module" x="900" y="138" width="360" height="104" rx="11"/>
  <text class="module-title" x="1080" y="176" text-anchor="middle">Geospatial Data Sources</text>
  <text class="module-text" x="1080" y="205" text-anchor="middle">Earth Engine · OSM · Kerala Hazards</text>

  <rect class="module" x="1325" y="138" width="360" height="104" rx="11"/>
  <text class="module-title" x="1505" y="176" text-anchor="middle">Location Services</text>
  <text class="module-text" x="1505" y="205" text-anchor="middle">Maps · Places · Street View</text>

  <rect class="module" x="1750" y="138" width="540" height="104" rx="11"/>
  <text class="module-title" x="2020" y="176" text-anchor="middle">Evidence Preprocessor</text>
  <text class="module-text" x="2020" y="205" text-anchor="middle">38 Features · Seasonal Sentinel-2 Chips</text>

  <path class="edge" d="M340 138 H382 V190 H479"/>
  <text class="label" x="418" y="178" text-anchor="middle">Requests</text>
  <path class="edge" d="M835 190 H894"/>
  <path class="edge" d="M1260 190 H1319"/>
  <path class="edge" d="M1685 190 H1744"/>

  <!-- Layer 2 -->
  <rect class="layer" x="430" y="330" width="1920" height="225" rx="34"/>
  <text class="layer-title" x="1390" y="362" text-anchor="middle">Layer 2: Land Context Processing</text>

  <rect class="module" x="500" y="401" width="380" height="104" rx="11"/>
  <text class="module-title" x="690" y="439" text-anchor="middle">Candidate Grid &amp; Site Selection</text>
