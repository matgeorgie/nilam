<svg xmlns="http://www.w3.org/2000/svg" width="2780" height="1100" viewBox="0 0 2780 1100" role="img" aria-labelledby="title desc">
  <title id="title">Nilam core system architecture</title>
  <desc id="desc">A wide monochrome architecture showing Nilam's core flow from user and geospatial inputs through land suitability, ArchAI2 house generation, Kerala cost estimation, and final outputs. A separate support layer shows model training data, project state, and cost data.</desc>
  <defs>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L13,6.5 L0,13 z" fill="#4b5563"/>
    </marker>
    <style>
      .background { fill: #ffffff; }
      .layer { fill: #ffffff; stroke: #66717d; stroke-width: 3; }
      .module { fill: #ffffff; stroke: #4f5a66; stroke-width: 2.5; }
      .module-soft { fill: #f4f5f6; stroke: #4f5a66; stroke-width: 2.5; }
      .inner { fill: #f8f9fa; stroke: #9aa3ad; stroke-width: 1.8; }
      .title { font: 700 34px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #202832; letter-spacing: 0.5px; }
      .subtitle { font: 500 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: #5a6470; }
      .layer-title { font: 700 21px Inter, ui-sans-serif, system-ui, sans-serif; fill: #313a44; letter-spacing: 0.4px; }
      .module-title { font: 700 24px Inter, ui-sans-serif, system-ui, sans-serif; fill: #27313b; }
      .module-text { font: 600 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: #424d58; }
      .support-title { font: 700 21px Inter, ui-sans-serif, system-ui, sans-serif; fill: #2f3944; }
      .support-text { font: 500 17px Inter, ui-sans-serif, system-ui, sans-serif; fill: #4d5864; }
      .edge { fill: none; stroke: #4b5563; stroke-width: 3.2; marker-end: url(#arrow); }
      .divider { stroke: #c4c9cf; stroke-width: 1.8; }
    </style>
  </defs>

  <rect class="background" width="2780" height="1100"/>
  <text class="title" x="1390" y="48" text-anchor="middle">NILAM — CORE SYSTEM ARCHITECTURE</text>
  <text class="subtitle" x="1390" y="80" text-anchor="middle">Land suitability · ArchAI2 house generation · Kerala construction cost estimation</text>

  <!-- Main product flow -->
  <rect class="layer" x="50" y="110" width="2680" height="560" rx="30"/>
  <text class="layer-title" x="90" y="151">MAIN PRODUCT FLOW</text>

  <rect class="module" x="100" y="190" width="360" height="410" rx="16"/>
  <text class="module-title" x="280" y="238" text-anchor="middle">Inputs &amp; Data</text>
  <line class="divider" x1="132" y1="261" x2="428" y2="261"/>
  <rect class="inner" x="132" y="292" width="296" height="58" rx="9"/>
  <text class="module-text" x="280" y="328" text-anchor="middle">Point · Radius · Brief</text>
  <rect class="inner" x="132" y="370" width="296" height="58" rx="9"/>
  <text class="module-text" x="280" y="406" text-anchor="middle">Earth Engine · Sentinel-2</text>
  <rect class="inner" x="132" y="448" width="296" height="58" rx="9"/>
  <text class="module-text" x="280" y="484" text-anchor="middle">SRTM · Soil · Hazards</text>
  <rect class="inner" x="132" y="526" width="296" height="48" rx="9"/>
  <text class="module-text" x="280" y="557" text-anchor="middle">OSM · Places · Maps</text>

  <rect class="module" x="540" y="190" width="620" height="410" rx="16"/>
  <text class="module-title" x="850" y="238" text-anchor="middle">Land Suitability</text>
  <line class="divider" x1="578" y1="261" x2="1122" y2="261"/>
  <rect class="inner" x="578" y="284" width="544" height="52" rx="9"/>
  <text class="module-text" x="850" y="317" text-anchor="middle">38-Feature Site Processor + Safety Gates</text>
  <rect class="inner" x="578" y="354" width="262" height="70" rx="9"/>
  <text class="module-text" x="709" y="382" text-anchor="middle">TabPFN 3.5</text>
  <text class="support-text" x="709" y="407" text-anchor="middle">Tabular evidence</text>
  <rect class="inner" x="860" y="354" width="262" height="70" rx="9"/>
  <text class="module-text" x="991" y="382" text-anchor="middle">TerraMind</text>
  <text class="support-text" x="991" y="407" text-anchor="middle">Satellite imagery</text>
  <rect class="inner" x="578" y="442" width="544" height="52" rx="9"/>
  <text class="module-text" x="850" y="475" text-anchor="middle">Cross-Attention + Calibrated Fusion</text>
  <rect class="inner" x="578" y="512" width="544" height="62" rx="9"/>
  <text class="module-text" x="850" y="539" text-anchor="middle">Suitability Score · SHAP</text>
  <text class="support-text" x="850" y="563" text-anchor="middle">Flat-land ranking · Amenities</text>

  <rect class="module" x="1260" y="190" width="520" height="410" rx="16"/>
  <text class="module-title" x="1520" y="238" text-anchor="middle">ArchAI2 House Generation</text>
  <line class="divider" x1="1298" y1="261" x2="1742" y2="261"/>
  <rect class="inner" x="1298" y="284" width="444" height="58" rx="9"/>
  <text class="module-text" x="1520" y="320" text-anchor="middle">Selected Site + House Brief</text>
  <rect class="inner" x="1298" y="360" width="444" height="58" rx="9"/>
  <text class="module-text" x="1520" y="396" text-anchor="middle">Qwen 3.5 9B Planning</text>
  <rect class="inner" x="1298" y="436" width="444" height="58" rx="9"/>
  <text class="module-text" x="1520" y="472" text-anchor="middle">Layout + Geometry Engine</text>
  <rect class="inner" x="1298" y="512" width="444" height="62" rx="9"/>
  <text class="module-text" x="1520" y="539" text-anchor="middle">Design Validation</text>
  <text class="support-text" x="1520" y="563" text-anchor="middle">2D plan · 3D model</text>

  <rect class="module" x="1880" y="190" width="400" height="410" rx="16"/>
  <text class="module-title" x="2080" y="238" text-anchor="middle">Cost Calculator</text>
  <line class="divider" x1="1918" y1="261" x2="2242" y2="261"/>
  <rect class="inner" x="1918" y="292" width="324" height="58" rx="9"/>
  <text class="module-text" x="2080" y="328" text-anchor="middle">Design Geometry</text>
  <rect class="inner" x="1918" y="370" width="324" height="58" rx="9"/>
  <text class="module-text" x="2080" y="406" text-anchor="middle">District Rates</text>
  <rect class="inner" x="1918" y="448" width="324" height="58" rx="9"/>
  <text class="module-text" x="2080" y="484" text-anchor="middle">Finish + Allowances</text>
  <rect class="inner" x="1918" y="526" width="324" height="48" rx="9"/>
  <text class="module-text" x="2080" y="557" text-anchor="middle">Budget Breakdown</text>

  <rect class="module-soft" x="2380" y="190" width="300" height="410" rx="16"/>
  <text class="module-title" x="2530" y="238" text-anchor="middle">Final Outputs</text>
  <line class="divider" x1="2412" y1="261" x2="2648" y2="261"/>
  <rect class="inner" x="2412" y="300" width="236" height="70" rx="9"/>
  <text class="module-text" x="2530" y="330" text-anchor="middle">Land</text>
  <text class="support-text" x="2530" y="355" text-anchor="middle">Assessment</text>
  <rect class="inner" x="2412" y="395" width="236" height="70" rx="9"/>
  <text class="module-text" x="2530" y="425" text-anchor="middle">House</text>
  <text class="support-text" x="2530" y="450" text-anchor="middle">Design</text>
  <rect class="inner" x="2412" y="490" width="236" height="70" rx="9"/>
  <text class="module-text" x="2530" y="520" text-anchor="middle">Construction</text>
  <text class="support-text" x="2530" y="545" text-anchor="middle">Estimate</text>

  <!-- Every main connector stays inside its own empty gap. -->
  <path class="edge" d="M468 395 H532"/>
  <path class="edge" d="M1168 395 H1252"/>
  <path class="edge" d="M1788 395 H1872"/>
  <path class="edge" d="M2288 395 H2372"/>

  <!-- Supporting data and state -->
  <rect class="layer" x="50" y="710" width="2680" height="320" rx="30"/>
  <text class="layer-title" x="90" y="751">DATA, TRAINING &amp; STATE</text>

  <rect class="module-soft" x="230" y="790" width="1080" height="178" rx="16"/>
  <text class="support-title" x="770" y="831" text-anchor="middle">Statewide Dataset &amp; Model Training</text>
  <line class="divider" x1="270" y1="852" x2="1270" y2="852"/>
  <text class="support-text" x="770" y="887" text-anchor="middle">1,400 Kerala points · 38 mapped features · dry and monsoon Sentinel-2 chips</text>
  <text class="support-text" x="770" y="922" text-anchor="middle">TabPFN fitting · TerraMind fine-tuning · cross-attention training · fusion calibration</text>

  <rect class="module-soft" x="1370" y="790" width="370" height="178" rx="16"/>
  <text class="support-title" x="1555" y="831" text-anchor="middle">Project State</text>
  <line class="divider" x1="1408" y1="852" x2="1702" y2="852"/>
  <text class="support-text" x="1555" y="889" text-anchor="middle">Selected plot · House brief</text>
  <text class="support-text" x="1555" y="924" text-anchor="middle">Design · Revisions</text>

  <rect class="module-soft" x="1800" y="790" width="590" height="178" rx="16"/>
  <text class="support-title" x="2095" y="831" text-anchor="middle">Kerala Cost Data</text>
  <line class="divider" x1="1840" y1="852" x2="2350" y2="852"/>
  <text class="support-text" x="2095" y="887" text-anchor="middle">District base rates · Finish tiers</text>
  <text class="support-text" x="2095" y="922" text-anchor="middle">Services · External works · Contingency</text>

  <!-- Each support connector is vertical and aligned with its target. -->
  <path class="edge" d="M850 782 V608"/>
  <path class="edge" d="M1555 782 V608"/>
  <path class="edge" d="M2095 782 V608"/>
</svg>
