  <text class="module-text" x="720" y="1287" text-anchor="middle">Measured Floor Area</text>

  <rect class="module" x="1000" y="1230" width="400" height="78" rx="11"/>
  <text class="module-title" x="1200" y="1262" text-anchor="middle">Kerala Cost Engine</text>
  <text class="module-text" x="1200" y="1287" text-anchor="middle">District · Finish · Allowances · Reserve</text>

  <rect class="module-soft" x="1500" y="1230" width="700" height="78" rx="11"/>
  <text class="module-title" x="1850" y="1262" text-anchor="middle">Final Product Outputs</text>
  <text class="module-text" x="1850" y="1287" text-anchor="middle">Land Report · House Design · Budget Range · Cost Breakdown · Exports</text>

  <path class="edge" d="M900 1269 H994"/>
  <path class="edge" d="M1400 1269 H1494"/>
  <path class="edge" d="M2155 1074 V1150 H720 V1224"/>

  <!-- Client feedback / output path -->
  <path class="edge" d="M1500 1269 V1328 H380 V196 H346"/>
  <text class="label" x="400" y="1317">Results and interactive views</text>

  <!-- Persistent data and model layer -->
  <rect class="layer" x="430" y="1370" width="1920" height="118" rx="30"/>
  <text class="layer-title" x="1390" y="1403" text-anchor="middle">Persistent Data, Model Registry &amp; Project State</text>
  <text class="module-text" x="1390" y="1437" text-anchor="middle">1,400-Point Statewide Cohort · Seasonal Satellite Chips · TabPFN / TerraMind Artifacts · Fusion Metrics</text>
  <text class="module-text" x="1390" y="1467" text-anchor="middle">SQLite Projects &amp; Revisions · Canonical House Geometry · Feature / Satellite Caches</text>

