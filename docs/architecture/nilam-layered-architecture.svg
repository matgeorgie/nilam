  <text class="module-title" x="2070" y="439" text-anchor="middle">Preference Router</text>
  <text class="module-text" x="2070" y="468" text-anchor="middle">Laya + Distil-Whisper</text>

  <path class="edge" d="M880 453 H959"/>
  <path class="edge" d="M1315 453 H1394"/>
  <path class="edge" d="M1790 453 H1869"/>
  <path class="edge" d="M2020 242 V318 H690 V395"/>
  <path class="edge" d="M2070 505 V562 H2107 V660"/>
  <text class="label" x="1848" y="315">Prepared evidence</text>

