  <text class="module-title" x="607" y="1005" text-anchor="middle">Site Context</text>
  <text class="module-text" x="607" y="1035" text-anchor="middle">Location · District</text>
  <text class="module-text" x="607" y="1061" text-anchor="middle">Suitability Score</text>

  <rect class="module" x="775" y="966" width="265" height="108" rx="11"/>
  <text class="module-title" x="907" y="1005" text-anchor="middle">Qwen 3.5 9B</text>
  <text class="module-text" x="907" y="1035" text-anchor="middle">House Requirements</text>
  <text class="module-text" x="907" y="1061" text-anchor="middle">Local LM Studio</text>

  <rect class="module" x="1075" y="966" width="265" height="108" rx="11"/>
  <text class="module-title" x="1207" y="1005" text-anchor="middle">Spatial Specification</text>
  <text class="module-text" x="1207" y="1035" text-anchor="middle">Rooms · Floors · Setbacks</text>
  <text class="module-text" x="1207" y="1061" text-anchor="middle">Adjacency · Plot Geometry</text>

  <rect class="module" x="1375" y="966" width="280" height="108" rx="11"/>
  <text class="module-title" x="1515" y="1005" text-anchor="middle">Layout Generation</text>
  <text class="module-text" x="1515" y="1035" text-anchor="middle">HouseGAN++ Proposals</text>
  <text class="module-text" x="1515" y="1061" text-anchor="middle">Procedural Optimizer</text>

  <rect class="module" x="1690" y="966" width="280" height="108" rx="11"/>
  <text class="module-title" x="1830" y="1005" text-anchor="middle">Geometry Validation</text>
  <text class="module-text" x="1830" y="1035" text-anchor="middle">Access · Area · Circulation</text>
  <text class="module-text" x="1830" y="1061" text-anchor="middle">Collision · Setbacks</text>

  <rect class="module-soft" x="2005" y="966" width="300" height="108" rx="11"/>
  <text class="module-title" x="2155" y="1005" text-anchor="middle">Design Outputs</text>
  <text class="module-text" x="2155" y="1035" text-anchor="middle">2D Plan · 3D Model</text>
  <text class="module-text" x="2155" y="1061" text-anchor="middle">Revisions · Exports</text>

  <path class="edge" d="M740 1020 H769"/>
  <path class="edge" d="M1040 1020 H1069"/>
  <path class="edge" d="M1340 1020 H1369"/>
